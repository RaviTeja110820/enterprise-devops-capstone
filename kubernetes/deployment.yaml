apiVersion: apps/v1
kind: Deployment

metadata:
  name: enterprise-app
  namespace: enterprise

spec:
  replicas: 2

  selector:
    matchLabels:
      app: enterprise-app

  template:
    metadata:
      labels:
        app: enterprise-app

    spec:
      containers:

      - name: enterprise-app

        image: 705557196379.dkr.ecr.ap-south-2.amazonaws.com/enterprise-devops-capstone:latest

        imagePullPolicy: Always

        ports:

        - containerPort: 3000

        resources:

          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        livenessProbe:

          httpGet:
            path: /
            port: 3000

          initialDelaySeconds: 15

          periodSeconds: 20

        readinessProbe:

          httpGet:
            path: /
            port: 3000

          initialDelaySeconds: 5

          periodSeconds: 10