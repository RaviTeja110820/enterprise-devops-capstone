# .github/workflows/cd.yml

name: Continuous Delivery

on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed

jobs:
  deploy:
    # Run only if the CI workflow completed successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest
    
    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build Docker Image
      - name: Build Docker Image
        working-directory: app
        run: |
          docker build -t enterprise-devops-capstone:${{ github.sha }} .

      # Tag Docker Image
      - name: Tag Docker Image
        run: |
          docker tag enterprise-devops-capstone:${{ github.sha }} \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

      # Push Docker Image
      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

      # Deployment Status
      - name: Deployment Status
        run: |
          echo "Docker image pushed successfully."
          echo "Starting deployment to Amazon EKS..."

      # Update kubeconfig
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name enterprise-eks

      # Deploy to Amazon EKS
      - name: Deploy to EKS
        run: |
          kubectl apply -f kubernetes/

      # Verify Deployment Rollout
      - name: Verify Rollout
        run: |
          kubectl rollout status deployment/enterprise-app -n enterprise