# .github/workflows/cd.yml

name: Continuous Delivery

on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed

jobs:
  deploy:
    # Run only if CI completed successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build Docker Image
      - name: Build Docker Image
        working-directory: app
        run: |
          docker build -t enterprise-devops-capstone:${{ github.sha }} .

      # Tag Docker Image
      - name: Tag Docker Image
        run: |
          docker tag enterprise-devops-capstone:${{ github.sha }} \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest

      # Push Docker Image
      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest

      # Update kubeconfig
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name enterprise-eks

      # Verify Cluster
      - name: Verify Cluster
        run: |
          kubectl config current-context
          kubectl get nodes

      # Create Namespace
      - name: Create Namespace
        run: |
          kubectl apply -f kubernetes/namespace.yaml

      # Wait for Namespace
      - name: Wait for Namespace
        run: |
          kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/enterprise --timeout=30s

      # Deploy Application
      - name: Deploy Application
        run: |
          kubectl apply -f kubernetes/deployment.yaml

      # Create Service
      - name: Create Service
        run: |
          kubectl apply -f kubernetes/service.yaml

      # Verify Rollout
      - name: Verify Rollout
        run: |
          kubectl rollout status deployment/enterprise-app -n enterprise