apiVersion: apps/v1
kind: Deployment

metadata:
  name: enterprise-app
  namespace: enterprise

spec:
  replicas: 2

  selector:
    matchLabels:
      app: enterprise

  template:
    metadata:
      labels:
        app: enterprise

    spec:
      containers:
        - name: app
          image: 705557196379.dkr.ecr.ap-south-2.amazonaws.com/enterprise-devops-capstone:7a796257c7fc5db1927e24e119717005cb586080

          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: username

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: password